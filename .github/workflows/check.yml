
name: Walmart Blackstone Check

on:
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send Discord test notification"
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  check-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Test Discord Notification
        if: ${{ inputs.send_test == true }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          url = os.environ.get("DISCORD_WEBHOOK_URL", "")

          if not url:
              raise SystemExit(
                  "ERROR: DISCORD_WEBHOOK_URL secret is missing"
              )

          data = json.dumps({
              "content": (
                  "Walmart Inventory Bot: "
                  "Discord test notification successful!"
              )
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "WalmartInventoryBot/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=20
              ) as response:
                  print("SUCCESS!")
                  print("Discord HTTP status:", response.status)

          except urllib.error.HTTPError as error:
              print("DISCORD REQUEST FAILED")
              print("HTTP status:", error.code)

              body = error.read().decode(
                  "utf-8", errors="replace"
              )

              try:
                  details = json.loads(body)
                  print(
                      "Discord error code:",
                      details.get("code", "N/A")
                  )
                  print(
                      "Discord error message:",
                      details.get("message", "N/A")
                  )
              except json.JSONDecodeError:
                  print(
                      "Non-JSON error response received."
                  )

              raise SystemExit(1)

          except urllib.error.URLError as error:
              print("NETWORK ERROR")
              print("Error type:", type(error.reason).__name__)
              raise SystemExit(1)
          PY

      - name: Run Walmart monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_TEST: "false"
        run: python monitor.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walmart-diagnostics
          path: |
            result.json
            page.png
            page_excerpt.txt
          if-no-files-found: ignore
          retention-days: 7
