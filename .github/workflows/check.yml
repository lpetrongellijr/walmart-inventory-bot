name: Test Discord Notification
env:
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
run: |
  python - <<'PY'
  import os
  import json
  import urllib.request

  url = os.environ.get("DISCORD_WEBHOOK_URL")

  if not url:
      raise Exception("Discord webhook secret is missing!")

  data = json.dumps({
      "content": "Walmart Bot Test: Discord notifications are working!"
  }).encode("utf-8")

  request = urllib.request.Request(
      url,
      data=data,
      headers={
          "Content-Type": "application/json",
          "User-Agent": "WalmartInventoryBot/1.0"
      },
      method="POST"
  )

    with urllib.request.urlopen(request, timeout=15) as response:
        print("Discord response:", response.status)
    PY



name: Walmart Blackstone Check

on:
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send Discord test notification"
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  check-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Walmart monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_TEST: ${{ inputs.send_test }}
        run: python monitor.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walmart-diagnostics
          path: |
            result.json
            page.png
            page_excerpt.txt
          if-no-files-found: ignore
          retention-days: 7
