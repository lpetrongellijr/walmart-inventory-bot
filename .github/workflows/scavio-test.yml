
name: Scavio Shipping Test

on:
  workflow_dispatch:

jobs:
  test-shipping:
    runs-on: ubuntu-latest

    steps:
      - name: Test Walmart shipping availability
        env:
          SCAVIO_API_KEY: ${{ secrets.SCAVIO_API_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          PRODUCT_ID = "15308304145"
          SHIPPING_ZIP = "60451"

          payload = {
            "product_id": "15308304145",
            "store_id": "4529",
            "delivery_zip": "60451",
            "domain": "com"
          }

          request = urllib.request.Request(
              "https://api.scavio.dev/api/v1/walmart/product",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['SCAVIO_API_KEY']}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "WalmartShippingMonitor/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=60
              ) as response:
                  data = json.load(response)

          except urllib.error.HTTPError as error:
              print(f"API ERROR: HTTP {error.code}")
              print(error.read().decode("utf-8")[:1000])
              raise

          # Support common API response structures.
          product = data.get("data", data)
          if isinstance(product, dict):
              product = product.get("product", product)

          if not isinstance(product, dict):
              raise ValueError("Unexpected API response format")

          location = product.get("location") or {}
          fulfillment = product.get("fulfillment") or {}

          if not isinstance(location, dict):
              location = {}
          if not isinstance(fulfillment, dict):
              fulfillment = {}

          returned_zip = str(
              location.get("zipcode")
              or location.get("zip_code")
              or ""
          )

          shipping = fulfillment.get("shipping")
          shipping_info = fulfillment.get(
              "shipping_information"
          )

          print()
          print("SCAVIO SHIPPING TEST")
          print("====================")
          print(f"Product ID: {PRODUCT_ID}")
          print(f"Requested shipping ZIP: {SHIPPING_ZIP}")
          print(f"Returned location: {location}")
          print(f"Shipping available: {shipping}")
          print(f"Shipping information: {shipping_info}")
          print(
              "Out of stock:",
              fulfillment.get("out_of_stock")
          )

          print()
          print("VERIFICATION")
          print("============")

          zip_matches = returned_zip == SHIPPING_ZIP

          print(f"ZIP matches: {zip_matches}")

          if zip_matches and shipping is True:
              print(
                  "RESULT: API reports shipping available "
                  "for the requested ZIP."
              )
          elif zip_matches and shipping is False:
              print(
                  "RESULT: API reports shipping unavailable "
                  "for the requested ZIP."
              )
          elif not zip_matches:
              print(
                  "RESULT: Shipping destination NOT verified. "
                  "API returned a different or missing ZIP."
              )
          else:
              print(
                  "RESULT: Shipping availability inconclusive."
              )

          print()
          print("Purchase alert: DISABLED")
          print("No Discord notification will be sent.")
          PY
